<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión — StudyFlow</title>
  <meta name="description" content="Inicia sesión en StudyFlow para continuar organizando tus estudios.">
  <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/auth.css">
  <link rel="stylesheet" href="../css/mockup.css">
</head>
<body class="auth-page">

  <a class="skip-link" href="#contenido">Saltar al contenido principal</a>

  <header class="site-header">
    <div class="navbar container">
      <a href="inicio.html" class="navbar__brand" aria-label="StudyFlow, ir a la página de inicio">
        <span class="navbar__logo" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 5.5C4 4.67 4.67 4 5.5 4H11V20H5.5C4.67 20 4 19.33 4 18.5V5.5Z" fill="white" fill-opacity="0.95"/>
            <path d="M20 5.5C20 4.67 19.33 4 18.5 4H13V20H18.5C19.33 20 20 19.33 20 18.5V5.5Z" fill="white" fill-opacity="0.7"/>
          </svg>
        </span>
        <span class="navbar__name">StudyFlow</span>
      </a>
      <div class="navbar__actions">
        <a href="iniciar-sesion.html" class="btn btn--ghost" aria-current="page">Iniciar Sesión</a>
        <a href="crear-cuenta.html" class="btn btn--primary">Comenzar Gratis</a>
      </div>
    </div>
  </header>

  <main class="auth" id="contenido">
    <div class="container auth__grid">
      <div class="auth__visual" id="authVisual" aria-hidden="true"></div>

      <section class="auth-card" aria-labelledby="authTitle">
        <h1 id="authTitle">Bienvenido de nuevo</h1>
        <p class="auth-card__subtitle">Continúa organizando tus estudios y alcanzando tus retos.</p>

        <form class="auth-form" id="loginForm" novalidate>
          <div class="field">
            <label for="loginEmail">Correo electrónico</label>
            <input type="email" id="loginEmail" name="email" placeholder="tucorreo@universidad.edu" autocomplete="email" required>
          </div>
          <div class="field">
            <div class="field__label-row"><label for="loginPassword">Contraseña</label><a href="recuperar-contrasena.html">¿Olvidaste tu contraseña?</a></div>
            <div class="input-wrap">
              <input type="password" id="loginPassword" name="password" placeholder="Tu contraseña" autocomplete="current-password" required>
              <button type="button" class="input-wrap__toggle" data-toggle-password aria-label="Mostrar contraseña" aria-pressed="false"></button>
            </div>
          </div>
          <p class="form-error" role="alert" hidden></p>
          <button type="submit" class="btn btn--primary btn--block">Iniciar Sesión</button>
        </form>

        <p class="auth-card__footer">¿No tienes cuenta? <a href="crear-cuenta.html">Crear una cuenta</a></p>
      </section>
    </div>
  </main>

  <script src="../js/api.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/icons.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/mockup.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
